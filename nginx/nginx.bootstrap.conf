client_max_body_size 500M;

# Conf minimale utilisée UNE SEULE FOIS pour obtenir le premier certificat
# Let's Encrypt (le challenge HTTP-01 de certbot a besoin que nginx tourne
# et serve /.well-known/acme-challenge/, mais la vraie nginx.conf ne peut
# pas démarrer tant que le certificat n'existe pas — voir RUNNING.md).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
