client_max_body_size 500M;

server {
    listen 80;
    server_name dkut.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dkut.online;

    ssl_certificate     /etc/letsencrypt/live/dkut.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dkut.online/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # react-router: toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/xxx -> backend /xxx (le / final sur proxy_pass retire le préfixe /api)
    location /api/ {
        proxy_pass http://app:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
